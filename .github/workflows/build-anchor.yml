name: Build Anchor Program

on:
  # Allows you to run this workflow manually from the Actions tab in GitHub
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIX: Explicitly installing a modern Rust version (1.77.2) and the required BPF target.
      # This ensures the Cargo version is new enough to read lock file version 4.
      - name: Install Rust (1.77.2) and BPF Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.2
          targets: solana-bpf

      # Installs Solana CLI tools using a direct download mirror for stability
      - name: Install Solana CLI (mirror)
        run: |
          wget https://github.com/solana-labs/solana/releases/download/v1.18.17/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar -xjf solana-release-x86_64-unknown-linux-gnu.tar.bz2
          # Move the binaries to a directory in the system's PATH
          sudo mv solana-release/bin/* /usr/local/bin/

      # Installs the Anchor Version Manager (avm) and sets a specific Anchor version (0.32.1)
      - name: Install Anchor via avm
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          # Use avm to install and set the desired Anchor version
          ~/.cargo/bin/avm install 0.32.1
          ~/.cargo/bin/avm use 0.32.1
          # Verify the installed version
          anchor --version

      - name: Build Program
        run: anchor build

      # Uploads the compiled program files (artifacts) so you can download and use them
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build
          path: |
            target/deploy/tomato_staking.so
            target/deploy/tomato_staking-keypair.json
            target/idl/tomato_staking.json
